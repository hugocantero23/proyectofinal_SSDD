syntax = "proto3";

option csharp_namespace = "Game.Contracts";
package distributed_dice;

//
// Completar los huecos marcados con ###
//

service GameService {
  rpc CreateGame (CreateGameRequest) returns (GameReply);
  rpc JoinGame (JoinGameRequest) returns (GameReply);
  rpc GetState (GetStateRequest) returns (GameReply);
  rpc Roll (RollRequest) returns (GameReply);
}

message CreateGameRequest {
  string name = 1;
  int32 player_count = 2;
}

message JoinGameRequest {
  string name = 1;
}

message GetStateRequest {
  string game_id = 1;
}

message RollRequest {
  string game_id = 1;
  string player_id = 2;
}

message GameReply {
  GameState state = 1;
  string player_id = 2;
  int32 first_die = 3;
  int32 second_die = 4;
  string event_delivery_warning = 5;
}

message GameState {
  string game_id = 1;
  string name = 2;
  int32 capacity = 3;
  GameStatus status = 4;
  repeated ### players = 5;
  string current_player_id = 6;
  string winner_id = 7;
}

message Player {
  string player_id = 1;
  int32 number = 2;
  int32 score = 3;
}

enum GameStatus {
  GAME_STATUS_WAITING_FOR_PLAYERS = 0;
  GAME_STATUS_IN_PROGRESS = 1;
  GAME_STATUS_FINISHED = 2;
}

message TurnEvent {
  string game_id = 1;
  int32 current_player_number = 2;
  int32 winner_player_number = 3;
}

message PlayerScore {
  string player_id = 1;
  int32 player_number = 2;
  int32 score = 3;
}

message ScoresEvent {
  string game_id = 1;
  repeated int32 scores = 2;
  int32 winner_player_number = 3;
}
